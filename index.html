/* ==========================================================================
   بوابة خدمات المستفيدين – جمعية البركة الخيرية
   الألوان مأخوذة من الصفحة الأصلية (الأخضر المزرق) مع لمسة ذهبية للهوية.
   ========================================================================== */

:root {
  /* الأخضر – من الصفحة الأصلية */
  --green-950: #013a3a;
  --green-900: #014848;
  --green-700: #0b6b6b;
  --green-500: #2f8f84;
  --green-200: #b9e6dc;
  --green-100: #dff3ee;
  --green-50:  #f1faf7;

  /* الذهبي – لمسات خفيفة فقط */
  --gold-600: #a07a24;   /* للنصوص الصغيرة (تباين كافٍ) */
  --gold-400: #c9a44c;
  --gold-100: #f6edd6;

  --ink:      #12302e;
  --ink-soft: #4a6663;
  --surface:  #ffffff;
  --line:     #dbe9e5;

  --radius-lg: 22px;
  --radius-md: 16px;
  --shadow-sm: 0 1px 2px rgba(1, 72, 72, 0.06), 0 4px 14px rgba(1, 72, 72, 0.06);
  --shadow-md: 0 2px 4px rgba(1, 72, 72, 0.06), 0 14px 32px rgba(1, 72, 72, 0.12);

  --font: "Tajawal", "Segoe UI", "Geeza Pro", "Noto Sans Arabic", Tahoma, system-ui, sans-serif;
}

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  color: var(--ink);
  line-height: 1.6;
  background-color: var(--green-50);
  background-image:
    radial-gradient(1200px 520px at 50% -180px, rgba(11, 107, 107, 0.16), transparent 70%),
    linear-gradient(180deg, #ffffff 0%, var(--green-50) 45%, var(--green-100) 100%);
  -webkit-font-smoothing: antialiased;
}

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap;
}

.skip-link {
  position: absolute;
  top: -60px; right: 16px;
  padding: 10px 16px;
  background: var(--green-900);
  color: #fff;
  border-radius: 10px;
  text-decoration: none;
  z-index: 10;
}
.skip-link:focus { top: 16px; }

.page {
  width: 100%;
  max-width: 1080px;
  margin: 0 auto;
  padding: clamp(32px, 6vw, 64px) 20px 28px;
  padding-left:  max(20px, env(safe-area-inset-left));
  padding-right: max(20px, env(safe-area-inset-right));
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ------------------------------ القسم العلوي ------------------------------ */
.hero {
  text-align: center;
  margin-bottom: clamp(28px, 5vw, 48px);
}

/* إطار الشعار: مستطيل بزوايا ناعمة يحافظ على نسبة أبعاد الشعار الرسمي (712×559) */
.hero__logo {
  width: clamp(150px, 30vw, 184px);
  min-height: 96px;
  margin: 0 auto 18px;
  padding: 16px 18px;
  display: grid;
  place-items: center;
  background: var(--surface);
  border-radius: 24px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm), 0 0 0 6px rgba(201, 164, 76, 0.12);
}
.hero__logo img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 712 / 559;
  object-fit: contain;
}
.hero__logo.logo--missing img { display: none; }
/* يظهر فقط إذا تعذّر تحميل الشعار */
.hero__logo.logo--missing::after {
  content: "البركة";
  font-weight: 800;
  font-size: 22px;
  color: var(--green-900);
}

.hero__org {
  margin: 0 0 4px;
  font-size: 15px;
  font-weight: 700;
  color: var(--green-700);
  letter-spacing: 0;
}

.hero__title {
  margin: 0;
  font-size: clamp(28px, 5vw, 40px);
  font-weight: 800;
  line-height: 1.3;
  color: var(--green-900);
}

.hero__divider {
  display: block;
  width: 56px;
  height: 3px;
  margin: 16px auto 14px;
  border-radius: 3px;
  background: linear-gradient(90deg, transparent, var(--gold-400), transparent);
}

.hero__greeting {
  margin: 0 0 4px;
  font-size: clamp(17px, 2.4vw, 20px);
  font-weight: 700;
  color: var(--gold-600);
}

.hero__intro {
  margin: 0;
  font-size: 16px;
  color: var(--ink-soft);
}

/* ------------------------------ قسم الخدمات ------------------------------ */
.main { flex: 1; }

.services {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 14px;
  grid-template-columns: 1fr;
}
@media (min-width: 640px) {
  .services { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
}
@media (min-width: 980px) {
  .services { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
}

.services__item { display: flex; }

.card {
  position: relative;
  width: 100%;
  min-height: 92px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 18px 18px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  color: inherit;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    border-color 0.2s ease;
}

/* شريط ذهبي رفيع على الجانب الأيمن يظهر عند التمرير */
.card::before {
  content: "";
  position: absolute;
  inset-block: 18px;
  inset-inline-start: -1px;
  width: 3px;
  border-radius: 3px;
  background: var(--gold-400);
  opacity: 0;
  transition: opacity 0.2s ease;
}

@media (min-width: 980px) {
  .card {
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    min-height: 190px;
    padding: 24px;
  }
  .card::before { inset-block: 24px; }
}

.card__icon {
  flex-shrink: 0;
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-md);
  color: var(--green-700);
  background: linear-gradient(145deg, var(--green-50), var(--green-100));
  border: 1px solid rgba(11, 107, 107, 0.12);
  transition: background 0.2s ease, color 0.2s ease;
}
.icon { width: 26px; height: 26px; }
.icon--sm { width: 18px; height: 18px; }

.card__body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.card__title-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.card__title {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.45;
  color: var(--green-900);
}

.card__desc {
  font-size: 14.5px;
  color: var(--ink-soft);
  line-height: 1.6;
}

.card__tag {
  display: inline-flex;
  align-items: center;
  padding: 1px 9px;
  font-size: 12px;
  font-weight: 700;
  line-height: 1.7;
  border-radius: 999px;
  white-space: nowrap;
}
.card__tag--video { color: var(--gold-600); background: var(--gold-100); }
.card__tag--file  { color: var(--green-700); background: var(--green-100); }
.card__tag--soon  { color: #6b6b6b; background: #eeeeee; }

.card__arrow {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--green-700);
  background: var(--green-50);
  transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
}
@media (min-width: 980px) {
  .card__arrow {
    position: absolute;
    top: 20px;
    inset-inline-end: 20px;
  }
}

/* التفاعل */
@media (hover: hover) {
  a.card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
    border-color: rgba(201, 164, 76, 0.55);
  }
  a.card:hover::before { opacity: 1; }
  a.card:hover .card__icon {
    color: #fff;
    background: linear-gradient(145deg, var(--green-700), var(--green-900));
  }
  a.card:hover .card__arrow {
    color: var(--green-900);
    background: var(--gold-100);
    transform: translate(-2px, -2px);
  }
}
a.card:active { transform: scale(0.985); box-shadow: var(--shadow-sm); }

a.card:focus-visible {
  outline: 3px solid var(--gold-400);
  outline-offset: 3px;
}

.card--soon {
  cursor: not-allowed;
  opacity: 0.75;
  box-shadow: none;
}
.card--soon .card__icon { color: #8a9a98; background: #f2f4f4; }
.card--soon .card__arrow { color: #8a9a98; background: #f2f4f4; }

/* ظهور هادئ مرة واحدة عند التحميل */
.js-ready .services__item {
  animation: rise 0.45s ease both;
  animation-delay: calc(var(--i-delay, 0) * 1ms);
}
.js-ready .services__item:nth-child(1) { --i-delay: 0; }
.js-ready .services__item:nth-child(2) { --i-delay: 50; }
.js-ready .services__item:nth-child(3) { --i-delay: 100; }
.js-ready .services__item:nth-child(4) { --i-delay: 150; }
.js-ready .services__item:nth-child(5) { --i-delay: 200; }
.js-ready .services__item:nth-child(n+6) { --i-delay: 250; }

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}

.noscript {
  text-align: center;
  padding: 16px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}

/* ------------------------------ التذييل ------------------------------ */
.footer {
  margin-top: clamp(36px, 6vw, 56px);
  padding-top: 20px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 20px;
  font-size: 14px;
  color: var(--ink-soft);
}
.footer__text { margin: 0; }

.website-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 4px;
  color: var(--green-700);
  font-weight: 700;
  text-decoration: none;
  border-radius: 8px;
}
.website-link:hover { color: var(--green-900); text-decoration: underline; text-underline-offset: 4px; }
.website-link:focus-visible { outline: 3px solid var(--gold-400); outline-offset: 2px; }
.website-link[hidden] { display: none; }

@media (max-width: 639px) {
  .footer { justify-content: center; text-align: center; flex-direction: column; }
  .card__title { font-size: 16px; }
  .card__desc { font-size: 14px; }
}

/* احترام تفضيل تقليل الحركة */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}

@media print {
  body { background: #fff; }
  .card { box-shadow: none; break-inside: avoid; }
  .skip-link { display: none; }
}

</style>

  <script>
/* منطق عرض البوابة – يقرأ البيانات من config.js ويبني البطاقات.
   لا يجمع هذا الملف أي بيانات شخصية ولا يخزّن شيئًا على جهاز المستخدم. */
(function () {
  "use strict";

  var config = window.PORTAL_CONFIG || { site: {}, services: [] };
  var icons = window.PORTAL_ICONS || {};
  var site = config.site || {};

  var TYPE_LABELS = { video: "فيديو", file: "ملف", service: "" };

  function svg(name, cls) {
    var body = icons[name] || icons.link || "";
    return (
      '<svg class="' + (cls || "icon") + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.75" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true" focusable="false">' +
      body + "</svg>"
    );
  }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text) node.textContent = text;
    return node;
  }

  /* يقبل فقط روابط http/https صحيحة؛ أي رابط فارغ أو غير صالح يعامل كـ«قريبًا» */
  function safeUrl(value) {
    if (!value || typeof value !== "string") return null;
    var trimmed = value.trim();
    if (!trimmed || trimmed === "#") return null;
    try {
      var parsed = new URL(trimmed);
      return parsed.protocol === "https:" || parsed.protocol === "http:"
        ? parsed.href
        : null;
    } catch (e) {
      return null;
    }
  }

  function setText(id, value) {
    var node = document.getElementById(id);
    if (node && value) node.textContent = value;
  }

  function renderHeader() {
    setText("org-name", site.orgName);
    setText("page-title", site.title);
    setText("greeting", site.greeting);
    setText("intro", site.intro);
    if (site.title && site.orgName) {
      document.title = site.title + " | " + site.orgName;
    }

    var logo = document.getElementById("logo");
    if (!logo) return;
    logo.alt = site.logoAlt || "";
    var triedFallback = false;
    logo.addEventListener("error", function () {
      if (!triedFallback && site.logoFallback) {
        triedFallback = true;
        logo.src = site.logoFallback;
      } else {
        logo.parentNode.classList.add("logo--missing");
      }
    });
    logo.src = site.logo || site.logoFallback || "";
  }

  function buildCard(service, index) {
    var url = safeUrl(service.url);
    var card = el(url ? "a" : "div", "card" + (url ? "" : " card--soon"));
    card.style.setProperty("--i", index);

    if (url) {
      card.href = url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.setAttribute(
        "aria-label",
        service.title + " – " + (service.description || "") + " (يفتح في نافذة جديدة)"
      );
    } else {
      card.setAttribute("aria-disabled", "true");
    }

    var iconWrap = el("span", "card__icon");
    iconWrap.innerHTML = svg(service.icon);

    var body = el("span", "card__body");
    var titleRow = el("span", "card__title-row");
    titleRow.appendChild(el("span", "card__title", service.title));
    var tagText = url ? TYPE_LABELS[service.type] : "قريبًا";
    if (tagText) {
      titleRow.appendChild(
        el("span", "card__tag card__tag--" + (url ? service.type : "soon"), tagText)
      );
    }
    body.appendChild(titleRow);
    if (service.description) {
      body.appendChild(el("span", "card__desc", service.description));
    }

    var arrow = el("span", "card__arrow");
    arrow.innerHTML = svg(url ? "arrow-out" : "clock", "icon icon--sm");

    card.appendChild(iconWrap);
    card.appendChild(body);
    card.appendChild(arrow);

    var item = el("li", "services__item");
    item.appendChild(card);
    return item;
  }

  function renderServices() {
    var list = document.getElementById("services");
    if (!list) return;
    var services = (config.services || []).filter(function (s) {
      return s && s.enabled !== false && s.title;
    });
    var frag = document.createDocumentFragment();
    services.forEach(function (s, i) {
      frag.appendChild(buildCard(s, i));
    });
    list.innerHTML = "";
    list.appendChild(frag);
    list.setAttribute("aria-busy", "false");
  }

  function renderFooter() {
    var year = document.getElementById("year");
    if (year) year.textContent = String(new Date().getFullYear());
    setText("footer-text", site.footerText);

    var link = document.getElementById("website-link");
    var url = safeUrl(site.websiteUrl);
    if (!link) return;
    if (url) {
      link.href = url;
      link.querySelector(".website-link__label").textContent =
        site.websiteLabel || "الموقع الرسمي";
      link.querySelector(".website-link__icon").innerHTML = svg("globe", "icon icon--sm");
      link.hidden = false;
    } else {
      link.hidden = true;
    }
  }

  function init() {
    renderHeader();
    renderServices();
    renderFooter();
    document.documentElement.classList.add("js-ready");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
